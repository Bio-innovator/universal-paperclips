name: 部署 GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 检查中文资源和脚本语法
        run: npm test

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传静态网页
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

      - name: 发布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
